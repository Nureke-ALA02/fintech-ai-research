experiment:
  seed: 42
  frameworks: [flask, fastapi]
  concurrency_levels: [1, 10, 50]
  total_requests: 200
  warmup_requests: 50
  repetitions: 3
  request_timeout_s: 10
server:
  host: 127.0.0.1
  port: 8000
  workers: 1
  startup_timeout_s: 20
data:
  requests_file: data/sample/requests.csv
output:
  results_dir: results
  raw_file: raw_latencies.csv
  summary_file: summary.csv
guardrails:
  max_error_rate: 0.01